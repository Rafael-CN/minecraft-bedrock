# nginx do mapa.
#
# A pagina do mapa (uNmINeD + tema) chama /api/pos para desenhar os
# jogadores ao vivo, mas esse endpoint vive no container do painel. Em vez
# de CORS e URL absoluta com porta no JavaScript, o nginx repassa /api/
# para o painel pela rede do compose - mesma origem para o navegador, e o
# painel continua publicado so em 127.0.0.1.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cookies em localhost sao compartilhados entre TODAS as portas: o
    # navegador manda para o mapa os cookies de qualquer outra coisa que
    # o Rafael rode em localhost. Quando a soma passa dos 8 KB do buffer
    # padrao, o nginx responde 400 "Request Header Or Cookie Too Large" e
    # o mapa nem carrega. Este mapa nao le cookie nenhum - o espaco extra
    # aqui e so para nao morrer carregando bagagem dos outros.
    large_client_header_buffers 8 64k;

    # Tiles e arquivos do mapa. O uNmINeD gera tudo estatico.
    location / {
        try_files $uri $uri/ =404;
    }

    # A lista de camadas e o unico arquivo que o PAINEL le direto daqui,
    # e ele mora noutra porta - o navegador trata isso como outra origem e
    # bloqueia sem este cabecalho. Foi so por isso que o seletor de camadas
    # nao aparecia: o arquivo existia, era servido, e a leitura morria no
    # CORS. Liberado so este; o resto do mapa continua fechado.
    location = /camadas.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # O mapa e redesenhado toda madrugada, e junto com ele mudam o
    # index.html, o unmined.js e - o que mais importa - as propriedades
    # com o centro e o zoom de abertura. Sem isto o navegador guarda a
    # versao velha desses arquivos e o mapa continua abrindo no lugar
    # errado mesmo depois de corrigido. Os tiles ficam de fora: sao
    # milhares, tem nome fixo por coordenada e valem cache.
    location ~* \.(js|html)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Os tiles tambem mudam a cada render - e sem cabecalho nenhum o
    # navegador guardava a versao antiga por conta propria. Foi por isso
    # que o mapa continuou cheio de rosa depois de corrigido: o servidor
    # ja tinha os tiles bons, o navegador e que mostrava os velhos.
    #
    # "no-cache" nao significa "nao guarde": significa "pergunte antes de
    # usar". Como o nginx manda ETag, a resposta e um 304 de poucos bytes
    # quando o tile nao mudou - barato, mesmo com milhares deles.
    location ~* \.(webp|png|jpg|jpeg)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Proxy para a API do painel (jogadores ao vivo, eventos, etc).
    location /api/ {
        # O nginx resolve o nome do container UMA vez, quando sobe, e
        # guarda o IP. Toda vez que o painel e recriado ele ganha um IP
        # novo, e o mapa passa a responder 502 sem nenhum aviso - foi o
        # que deixou os jogadores sumidos do mapa. Com o resolver do
        # Docker e o destino numa variavel, o nome e resolvido a cada
        # chamada e o mapa acompanha o painel para onde ele for.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $destino_painel painel;
        proxy_pass http://$destino_painel:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        # Resposta de status nao deve ficar em cache no navegador.
        add_header Cache-Control "no-store" always;
    }
}
